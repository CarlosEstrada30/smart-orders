<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>SmartOrders - Gestión Inteligente</title>
    <meta name="title" content="SmartOrders - Gestión Inteligente" />
    <meta
      name="description"
      content="Sistema de gestión inteligente para empresas, con módulos de inventario, órdenes, facturación electrónica y más."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smart-orders.onrender.com" />
    <meta property="og:title" content="SmartOrders - Gestión Inteligente" />
    <meta
      property="og:description"
      content="Sistema de gestión inteligente para empresas, con módulos de inventario, órdenes, facturación electrónica y más."
    />
    <meta
      property="og:image"
      content="https://smart-orders.onrender.com/images/favicon.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://smart-orders.onrender.com" />
    <meta property="twitter:title" content="SmartOrders - Gestión Inteligente" />
    <meta
      property="twitter:description"
      content="Sistema de gestión inteligente para empresas, con módulos de inventario, órdenes, facturación electrónica y más."
    />
    <meta
      property="twitter:image"
      content="https://smart-orders.onrender.com/images/favicon.png"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#0B4A3F" />
    <!-- Aplica modo y paleta guardados antes de cargar la app (evita destello) -->
    <script>
      (function () {
        var c = '; ' + document.cookie
        var get = function (n) {
          var p = c.split('; ' + n + '=')
          return p.length === 2 ? p.pop().split(';').shift() : null
        }
        var root = document.documentElement
        var mode = get('vite-ui-theme') || 'system'
        if (mode === 'system')
          mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        root.classList.add(mode)
        var palette = get('so-palette')
        if (palette && /^(anil|cacao|volcan)$/.test(palette)) root.dataset.palette = palette
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
